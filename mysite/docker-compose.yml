
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysite}
      POSTGRES_USER: ${POSTGRES_USER:-mysite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mysite.dump:/docker-entrypoint-initdb.d/mysite.dump:ro
      - ./restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    ports:
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  onlyoffice:
    image: onlyoffice/documentserver:8.1.0.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-dev-onlyoffice-jwt-secret}
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysite}
      POSTGRES_USER: ${POSTGRES_USER:-mysite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysite}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,[::1],host.docker.internal"
      ONLYOFFICE_PUBLIC_DS_URL: "http://localhost:8082"
      ONLYOFFICE_DS_URL: "http://onlyoffice"
      ONLYOFFICE_APP_PUBLIC_URL: "http://host.docker.internal:8000"
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-dev-onlyoffice-jwt-secret}
    depends_on:
      db:
        condition: service_healthy
      onlyoffice:
        condition: service_started

volumes:
  postgres_data:
